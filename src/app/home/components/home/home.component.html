<header>
    <div class="home-header">
        <div class="d-flex justify-content-between align-items-center">
            <div class="d-flex align-items-end">
                <div>
                    <img class="profile-img" src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQM1BdVc0_lkQOGl43Lxa--0F71lUE45IwcTUVklQ6QKXJ5_kcrfRflOXg&s=10" alt="profile-photo">
                </div>             
            </div>
            <div>
                <div class="d-flex">
                    <div class="">
                        <button class="btn btn-outline-primary"> 
                            Configurações 
                        </button>
                        <button class="btn btn-outline-primary"> 
                            Acessar Meu Finnas 
                        </button>
                        <button class="btn btn-outline-primary"> 
                            Meu Perfil 
                        </button>
                        <button class="btn btn-outline-primary"> 
                            Adicionar Novo Gasto 
                        </button>
                        <button [routerLink]="['/gerenciar-gastos']" class="btn btn-outline-primary"> 
                            Gerenciar Gastos 
                        </button>
                        <button  class="btn btn-outline-primary"> 
                            Credores 
                        </button>
                        <button  class="btn btn-outline-primary"> 
                            Formas de pagamento 
                        </button>
                        <button  class="btn btn-outline-primary"> 
                            Adicionar Renda 
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>
</header>

<body class="finnas-body">    
    <div>
        <div class="mt-4 mb-4">
            <h3> Olá, {{ this.userName }}! </h3>
        </div>   

        <div class="d-flex justify-content-center gap-3 mt-3">
            <div class="card" style="width: 18rem;">            
                <div class="card-body">
                    <h5 class="card-title">Saldo atual</h5>
                    <hr>
                    <span class="text-success">  + {{ saldoAtual | currency:'BRL' }} </span>             
                </div>
            </div>

            <div class="card" style="width: 18rem;">            
                <div class="card-body">
                    <h5 class="card-title">Gastos do mês</h5>
                    <hr>
                    <span class="text-danger">  - {{ gastoMes | currency:'BRL' }} </span>   
                </div>
            </div>

            <div class="card" style="width: 18rem;">            
                <div class="card-body">
                    <h5 class="card-title">Receitas do mês</h5>
                    <hr>
                    <span class="text-success">  + {{ receitaMes | currency:'BRL' }} </span>   
                </div>
            </div>

            <div class="card" style="width: 18rem;">            
                <div class="card-body">
                    <h5 class="card-title">Economia do mês</h5>
                    <hr>
                    <span class="text-success">  + {{ economiaMes | currency:'BRL' }} </span>                       
                </div>
            </div>
        </div>

    </div>
</body>
