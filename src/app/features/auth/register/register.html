<div class="min-vh-100 d-flex align-items-center justify-content-center bg-light">
  <div class="card shadow-sm p-4" style="width: 100%; max-width: 400px;">

    <h4 class="mb-4 text-center fw-semibold">Criar conta</h4>

    <div *ngIf="error" class="alert alert-danger py-2">{{ error }}</div>

    <form [formGroup]="form" (ngSubmit)="onSubmit()">

      <div class="mb-3">
        <label class="form-label">Nome</label>
        <input
          type="text"
          class="form-control"
          formControlName="name"
          [class.is-invalid]="form.get('name')?.invalid && form.get('name')?.touched"
        />
        <div class="invalid-feedback">Nome obrigatório.</div>
      </div>

      <div class="mb-3">
        <label class="form-label">E-mail</label>
        <input
          type="email"
          class="form-control"
          formControlName="email"
          [class.is-invalid]="form.get('email')?.invalid && form.get('email')?.touched"
        />
        <div class="invalid-feedback">E-mail inválido.</div>
      </div>

      <div class="mb-4">
        <label class="form-label">Senha</label>
        <input
          type="password"
          class="form-control"
          formControlName="password"
          [class.is-invalid]="form.get('password')?.invalid && form.get('password')?.touched"
        />
        <div class="invalid-feedback">Mínimo 6 caracteres.</div>
      </div>

      <button
        type="submit"
        class="btn btn-primary w-100"
        [disabled]="loading || form.invalid"
      >
        <span *ngIf="loading" class="spinner-border spinner-border-sm me-2"></span>
        Cadastrar
      </button>

    </form>

    <p class="mt-3 mb-0 text-center text-muted" style="font-size: 14px;">
      Já tem conta? <a routerLink="/auth/login">Entrar</a>
    </p>

  </div>
</div>
